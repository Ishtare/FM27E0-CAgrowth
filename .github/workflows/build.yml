name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run local regression checks without FM
        shell: powershell
        run: ./tests/run.ps1
      - name: Build the Windows editor
        shell: powershell
        run: ./build.ps1
      - name: Upload the checked build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FM27E0-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            FM27E0-CAgrowth v*.exe
            LICENSE
            ADDITIONAL-TERMS.txt
            VALIDATION.md
            third-party/**
